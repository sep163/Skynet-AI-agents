<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyNet Sentinel — пульт и ИИ-поддержка</title>
<style>
:root{--bg:#0f1420;--panel:#171e2e;--line:#26304a;--text:#e6e9f2;--mute:#8b94ad;--ok:#2fbf71;--warn:#e6b23a;--major:#f08a3c;--crit:#ef4d5a;--acc:#4f8cff}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0 12px 0 0}.clock{font:600 18px ui-monospace,monospace;color:var(--acc)}
button,select,input,textarea{font:inherit;color:var(--text);background:#1f2840;border:1px solid var(--line);border-radius:6px;padding:5px 10px}
button{cursor:pointer}button:hover{border-color:var(--acc)}button.pri{background:var(--acc);border-color:var(--acc)}button.ok{background:#1d5c3b}button.no{background:#5c1d25}
.badge{font-size:12px;padding:2px 8px;border-radius:10px;background:#26304a;color:var(--mute)}
main{display:grid;grid-template-columns:1.35fr 1fr;gap:12px;padding:12px;height:calc(100vh - 56px)}
.col{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.tile{border-radius:8px;padding:6px;border:1px solid var(--line);font-size:12px}
.tile b{display:block;font-size:13px}.s-ok{border-left:4px solid var(--ok)}.s-warning{border-left:4px solid var(--warn)}.s-major{border-left:4px solid var(--major)}.s-critical{border-left:4px solid var(--crit)}
.card{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;background:#141a28}.card.resolved{opacity:.5}
.card .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.card .ev{color:var(--mute);font-size:12.5px;margin-top:3px}
.sev{font-size:11px;font-weight:700;padding:1px 7px;border-radius:8px;color:#000}.sev.warning{background:var(--warn)}.sev.major{background:var(--major)}.sev.critical{background:var(--crit);color:#fff}
.done{opacity:.55}.brief{white-space:pre-wrap;background:#0f1522;border-radius:6px;padding:8px;margin-top:6px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:12.5px}td,th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.chat{display:flex;flex-direction:column;min-height:0;flex:1}.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.m{max-width:88%;padding:8px 11px;border-radius:10px;white-space:pre-wrap}.m.user{align-self:flex-end;background:#24407a}.m.assistant{align-self:flex-start;background:#222b40}
.m small{display:block;color:var(--mute);margin-top:4px;font-size:11.5px}details{margin-top:4px;font-size:12px;color:var(--mute)}details pre{white-space:pre-wrap;max-height:220px;overflow:auto}
.emo0{color:var(--ok)}.emo1{color:var(--warn)}.emo2{color:var(--major)}.emo3{color:var(--crit);font-weight:700}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}textarea{flex:1;min-height:46px;resize:vertical}
.rec{background:var(--crit)!important}
@media(max-width:1100px){main{grid-template-columns:1fr;height:auto}.tiles{grid-template-columns:repeat(3,1fr)}.chat{min-height:520px}}.notif{font-size:12.5px;border-left:3px solid var(--acc);padding:4px 8px;margin:4px 0;background:#141a28}
</style>
</head>
<body>
<header>
  <h1>SkyNet Sentinel</h1>
  <span class="clock" id="clock">--:--</span>
  <button onclick="step(1)">+1 мин</button><button onclick="step(5)">+5</button><button onclick="step(30)">+30</button>
  <button id="play" onclick="togglePlay()">▶ авто</button>
  <span class="badge">неисправность:</span>
  <select id="kind" onchange="fillTargets()"></select><select id="target"></select><button onclick="inject()">Внести</button>
  <label class="badge"><input type="checkbox" id="auto" checked onchange="setAutonomy()"> ИИ выполняет безопасные действия сам</label>
  <button onclick="resetSim()">Сброс</button>
  <span class="badge" id="model"></span>
</header>
<main>
  <div class="col">
    <div class="panel"><h2>Сеть <span id="netinfo" class="badge"></span></h2><div class="tiles" id="tiles"></div></div>
    <div class="panel"><h2>Требует решения человека <span class="badge" id="pcount"></span></h2><div id="pending"></div></div>
    <div class="panel"><h2>Инциденты мониторинга</h2><div id="incidents"></div></div>
    <div class="panel"><h2>График мастеров</h2><div id="jobs"></div></div>
    <div class="panel"><h2>Журнал: что ИИ сделал сам</h2><div id="log"></div></div>
  </div>
  <div class="col">
    <div class="panel chat">
      <h2>Чат клиента (личный кабинет) <select id="client" onchange="newChat()"></select></h2>
      <div id="cinfo" class="badge" style="margin-bottom:6px"></div>
      <div id="notifs"></div>
      <div class="msgs" id="msgs"></div>
      <div class="row" style="margin-top:8px">
        <textarea id="inp" placeholder="Сообщение клиента… (Enter — отправить)"></textarea>
        <div style="display:flex;flex-direction:column;gap:4px"><button id="mic" onclick="toggleMic()">🎙 Диктовка</button><button class="pri" onclick="send()">Отправить</button></div>
      </div>
      <div id="vinfo" class="badge" style="margin-top:4px;display:none"></div>
    </div>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);let S=null,play=null,hist=[],voice=null,rec=null,chunks=[];
const SEV={warning:1,major:2,critical:3};const KL={cable_degradation:'Деградация кабеля (порт)',speed_downgrade:'Порт на 100 Мбит/с (порт)',optic_degradation:'Деградация оптики аплинка (коммутатор)',switch_power:'Пропало питание (коммутатор)',congestion:'Перегрузка (агрегация)'};
const LV={cable_degradation:'port',speed_downgrade:'port',optic_degradation:'switch',switch_power:'switch',congestion:'agg'};
const api=async(u,b,m)=>{const r=await fetch(u,{method:m||(b?'POST':'GET'),headers:b instanceof FormData?{}:{'Content-Type':'application/json'},body:b instanceof FormData?b:b?JSON.stringify(b):undefined});if(!r.ok)throw new Error((await r.json().catch(()=>({detail:r.statusText}))).detail);return r.json()};
const tm=s=>s?s.slice(11,16):'';const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function load(){S=await api('/api/state');render()}
async function step(n){S=await api('/api/sim/step',{minutes:n});render()}
function togglePlay(){if(play){clearInterval(play);play=null;$('play').textContent='▶ авто'}else{play=setInterval(()=>step(1),700);$('play').textContent='⏸ пауза'}}
async function inject(){await api('/api/sim/inject',{kind:$('kind').value,target:$('target').value});load()}
async function resetSim(){S=await api('/api/sim/reset',{});render();newChat()}
async function setAutonomy(){await api('/api/sim/autonomy',{approve:$('auto').checked});load()}
async function decide(id,ok){await api(`/api/actions/${id}/decide`,{approve:ok});load()}
async function complete(id){await api(`/api/jobs/${id}/complete`,{});load()}
async function brief(id,btn){btn.disabled=true;btn.textContent='думаю…';try{const r=await api(`/api/incidents/${id}/brief`,{});$('b-'+id).innerHTML=`<div class="brief">${esc(r.brief)}</div>`}catch(e){alert(e.message)}btn.disabled=false;btn.textContent='Разбор ИИ'}
function fillTargets(){if(!S)return;const k=$('kind').value;$('target').innerHTML=S.targets[LV[k]].map(t=>`<option>${t}</option>`).join('')}
function render(){
  $('clock').textContent=S.network.t.replace('T',' ');
  if(!$('kind').options.length){$('kind').innerHTML=S.fault_kinds.map(k=>`<option value="${k}">${KL[k]}</option>`).join('');fillTargets();$('target').value='sw-01/5'}
  const open=S.incidents.filter(i=>i.status==='open');
  const worst=t=>open.filter(i=>i.target===t||i.target.startsWith(t+'/')||(i.level==='agg'&&S.network.switches.find(s=>s.id===t)?.agg===i.target)).reduce((a,i)=>SEV[i.severity]>SEV[a]?i.severity:a,'ok');
  $('tiles').innerHTML=S.network.switches.map(s=>{const w=s.reachable?worst(s.id):'critical';return `<div class="tile s-${w==='ok'?'ok':w}"><b>${s.id} · ${s.agg}</b>${esc(s.building)}<br>${s.reachable?`RX ${s.rx_dbm} дБм`:'<span style="color:var(--crit)">нет связи</span>'} · портов down: ${s.ports_down}</div>`}).join('');
  $('netinfo').textContent=S.network.aggs.map(a=>`${a.id}: ${Math.round(a.util)}% / ${a.latency_ms} мс`).join(' · ');
  const pend=S.actions.filter(a=>a.status==='pending');$('pcount').textContent=pend.length;
  $('pending').innerHTML=pend.map(a=>{const d=a.details||{};return `<div class="card"><div class="t"><span class="sev ${a.priority==='critical'?'critical':a.priority==='high'?'major':'warning'}">${a.priority}</span><b>${esc(a.title)}</b><span class="badge">${a.type}</span><span class="badge">${a.id}${a.incident_id?' · '+a.incident_id:''}</span></div>
   <div class="ev">${d.slot?`Предложен слот: ${tm(d.slot.start)}–${tm(d.slot.end)}, ${esc(d.slot.tech)}. `:''}${d.deadline?`Отказ прогнозируется к ${tm(d.deadline)}. `:''}${d.warning?`<b style="color:var(--crit)">⚠ ${esc(d.warning)}</b> `:''}${d.evidence?'Основание: '+esc(d.evidence):''}${d.summary?'Резюме: '+esc(d.summary):''}</div>
   <div class="row" style="margin-top:6px"><button class="ok" onclick="decide('${a.id}',true)">Одобрить</button><button class="no" onclick="decide('${a.id}',false)">Отклонить</button></div></div>`}).join('')||'<div class="ev">Очередь пуста — всё решено автоматически</div>';
  $('incidents').innerHTML=S.incidents.slice(0,30).map(i=>`<div class="card ${i.status}"><div class="t"><span class="sev ${i.severity}">${i.severity}</span><b>${esc(i.title)}</b><span class="badge">${i.target}</span><span class="badge">${i.id} · обнаружен ${tm(i.detected_at)}${i.status==='resolved'?' · решён '+tm(i.resolved_at):''}</span>${i.first_kind!==i.kind?`<span class="badge">эскалация: ${i.first_kind} → ${i.kind}</span>`:''}</div>
   <div class="ev">${esc(i.evidence)}</div><div class="ev">→ ${esc(i.recommendation)}</div><div class="row" style="margin-top:4px"><button onclick="brief('${i.id}',this)">Разбор ИИ</button></div><div id="b-${i.id}"></div></div>`).join('')||'<div class="ev">Сеть в норме</div>';
  $('jobs').innerHTML='<table><tr><th>Мастер</th><th>Работы</th></tr>'+S.technicians.map(t=>`<tr><td><b>${esc(t.name)}</b><br><span class="badge">${t.skills.join(', ')} · ${t.zones.join(', ')} · ${t.shift.join('–')}</span></td><td>${S.jobs.filter(j=>j.tech_id===t.id).map(j=>`<div class="${j.status==='done'?'done':''}">${tm(j.start)}–${tm(j.end)} ${esc(j.reason)} ${j.address?'· '+esc(j.address):''} <span class="badge">${j.status==='tentative'?'ждёт одобрения':j.status==='confirmed'?'подтверждён':j.status==='done'?'выполнен':j.status}</span>${j.status==='confirmed'&&j.incident_id?` <button onclick="complete('${j.id}')">Выполнено</button>`:''}</div>`).join('')}</td></tr>`).join('')+'</table>';
  $('log').innerHTML=S.actions.filter(a=>a.status!=='pending').slice(0,25).map(a=>`<div class="ev">${tm(a.decided_at||a.created_at)} <span class="badge">${a.status==='done'?'авто':a.status==='approved'?'одобрено':'отклонено'}</span> ${esc(a.title)}</div>`).join('');
  const cid=$('client').value;$('notifs').innerHTML=S.notifications.filter(n=>n.client_id===cid).slice(0,3).map(n=>`<div class="notif">🔔 ${tm(n.t)} ${esc(n.text)}</div>`).join('');
}
async function loadClients(){const cs=await api('/api/clients');$('client').innerHTML=cs.map(c=>`<option value="${c.id}">${esc(c.name)} (${c.type}${c.status==='blocked'?', заблокирован':''})</option>`).join('');window.CL=cs;newChat()}
function newChat(){hist=[];$('msgs').innerHTML='';const c=(window.CL||[]).find(x=>x.id===$('client').value);if(c)$('cinfo').textContent=`${c.address} · ${c.tariff.name} · ${c.router} · порт ${c.port}`;if(S)render()}
function addMsg(role,text,extra){const d=document.createElement('div');d.className='m '+role;d.innerHTML=esc(text)+(extra||'');$('msgs').appendChild(d);$('msgs').scrollTop=1e9;return d}
async function send(){const t=$('inp').value.trim();if(!t)return;$('inp').value='';const u=addMsg('user',t);hist.push({role:'user',content:t});const w=addMsg('assistant','…');
  try{const r=await api('/api/chat',{client_id:$('client').value,messages:hist,voice});voice=null;$('vinfo').style.display='none';
   const e=r.emotion;u.innerHTML+=`<small class="emo${e.level}">тон: ${e.level}/3 · ${esc(e.label)}${e.reason?' — '+esc(e.reason):''}${e.voice?' · голос усилил оценку':''}</small>`;
   w.innerHTML=esc(r.answer)+(r.trace.length?`<details><summary>Инструменты: ${r.trace.map(x=>x.tool).join(' → ')}</summary><pre>${esc(JSON.stringify(r.trace,null,1))}</pre></details>`:'');
   hist.push({role:'assistant',content:r.answer});load()}catch(e){w.textContent='Ошибка: '+e.message}}
$('inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
async function toggleMic(){if(rec){rec.stop();return}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(st);chunks=[];rec.ondataavailable=e=>chunks.push(e.data);
   rec.onstop=async()=>{st.getTracks().forEach(t=>t.stop());$('mic').classList.remove('rec');$('mic').textContent='⏳ расшифровка';const fd=new FormData();fd.append('audio',new Blob(chunks,{type:rec.mimeType}),'voice.'+(rec.mimeType.includes('mp4')?'mp4':'webm'));rec=null;
    try{const r=await api('/api/transcribe',fd);$('inp').value=($('inp').value+' '+r.text).trim();voice=r;$('vinfo').style.display='inline-block';$('vinfo').textContent=`локально (whisper ${r.model}): ${r.duration_s} с · ${r.words_per_sec} слов/с · громкость ${r.loudness_db} дБ`}catch(e){alert(e.message)}$('mic').textContent='🎙 Диктовка'};
   rec.start();$('mic').classList.add('rec');$('mic').textContent='⏹ Стоп'}catch(e){alert('Микрофон недоступен: '+e.message)}}
api('/api/health').then(h=>$('model').textContent=`${h.provider}: ${h.model}${h.voice?' · голос локально':''}`);
load().then(loadClients);
</script>
</body>
</html>
