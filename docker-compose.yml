services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      OLLAMA_URL: ${OLLAMA_URL_DOCKER:-http://host.docker.internal:11434}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["whisper-cache:/root/.cache/huggingface"]
volumes:
  whisper-cache:
